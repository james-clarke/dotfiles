name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s bash -e SC1090,SC1091 setup.sh bash/bashrc bash/bash_profile
      - run: jq empty claude/settings.json opencode/opencode.json vscode/settings.json
      - run: git config -f git/config -l >/dev/null

  links:
    # link() must replace existing files and be idempotent
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: link into a fresh HOME, twice
        run: |
          export HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$HOME"
          echo original > "$HOME/.bashrc"

          # opencode is never on a runner: expect exactly exit 1 with the missing-tools report
          run() { rc=0; out=$(./setup.sh bash git ssh vscode opencode claude 2>&1) || rc=$?; echo "$out"; test $rc -eq 1; echo "$out" | grep -q "Missing. Install"; }
          run
          test "$(readlink "$HOME/.bashrc")" = "$PWD/bash/bashrc"
          test "$(readlink "$HOME/.claude/settings.json")" = "$PWD/claude/settings.json"
          test "$(readlink "$HOME/.config/git/config")" = "$PWD/git/config"
          test "$(readlink "$HOME/.config/opencode/opencode.json")" = "$PWD/opencode/opencode.json"
          test "$(readlink "$HOME/.ssh/config")" = "$PWD/ssh/config"
          if [ "$(uname)" = Darwin ]; then vs="$HOME/Library/Application Support/Code/User/settings.json"; else vs="$HOME/.config/Code/User/settings.json"; fi
          test "$(readlink "$vs")" = "$PWD/vscode/settings.json"

          run                                                   # second run is a no-op
          test "$(readlink "$HOME/.bashrc")" = "$PWD/bash/bashrc"
          test -z "$(ls "$HOME"/.bashrc.bak* 2>/dev/null)"       # no backups made

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: every formula and cask setup.sh installs resolves
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          for f in bash git gh node; do brew info --formula "$f" >/dev/null; done
          for c in visual-studio-code google-chrome tailscale-app claude-code; do brew info --cask "$c" >/dev/null; done
      - run: plutil -lint macos/*.plist
