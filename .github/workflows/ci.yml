name: ci
on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: apt-get update -q && apt-get install -y -q git ca-certificates
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: every package in os/apt-packages.txt exists on trixie
        run: xargs -a os/apt-packages.txt apt-get install -y -q && apt-get install -y -q emacs-nox
      - run: shellcheck bootstrap.sh install.sh preflight.sh os/*.sh os/macos/*.sh claude/statusline.sh kde/*.sh
      - run: zsh -n zsh/.zshenv zsh/.zprofile zsh/.zshrc zsh/home.zshenv
      - run: jq empty claude/settings.json && git config -f config/git/config -l >/dev/null
      - name: preflight without a tty keeps what it finds
        run: |
          export HOME=/tmp/ci-home; mkdir -p "$HOME/.emacs.d"
          printf '[user]\n\tname = CI\n\temail = ci@example.com\n' > "$HOME/.gitconfig"
          ./preflight.sh
          test -d "$HOME/.emacs.d" && test -f "$HOME/.gitconfig"
      - name: install into a fresh HOME twice (archive, prune), start the real shell
        run: |
          export HOME=/tmp/ci-home
          mkdir -p "$HOME/.config/ghostty" && echo old > "$HOME/.config/ghostty/config"
          ./install.sh | tee /tmp/install.log
          grep -q "^archived   $HOME/.config/ghostty/config" /tmp/install.log
          ./install.sh
          ./install.sh check
          out=$(timeout 30 zsh -i -c exit 2>&1 | grep -v "can.t change option: zle" || true)
          [ -z "$out" ] || { echo "$out"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: /tmp/ci-home/.config/emacs/elpa
          key: elpa-${{ runner.os }}-${{ hashFiles('emacs/init.el') }}
      - name: load init.el (installs packages), then byte-compile
        run: |
          export HOME=/tmp/ci-home
          xdg='(setq user-emacs-directory (expand-file-name "~/.config/emacs/") package-user-dir (expand-file-name "~/.config/emacs/elpa"))'
          emacs --batch --eval "$xdg" -l emacs/early-init.el -l emacs/init.el --eval '(message "loaded %d packages" (length package-activated-list))'
          emacs --batch --eval "$xdg" -l emacs/early-init.el -l emacs/init.el -f batch-byte-compile emacs/early-init.el emacs/init.el

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: every tap and cask in os/Brewfile resolves (casks skipped)
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          HOMEBREW_BUNDLE_CASK_SKIP=$(brew bundle list --file os/Brewfile --cask | tr '\n' ' ') brew bundle --file os/Brewfile
      - run: brew install -q emacs shellcheck
      - run: shellcheck bootstrap.sh install.sh preflight.sh os/*.sh os/macos/*.sh claude/statusline.sh kde/*.sh
      - run: zsh -n zsh/.zshenv zsh/.zprofile zsh/.zshrc zsh/home.zshenv
      - run: plutil -lint os/macos/*.plist
      - name: every tool in both mise configs resolves
        run: |
          curl -fsSL https://mise.run | MISE_INSTALL_PATH="$RUNNER_TEMP/mise" sh
          for t in $(sed -n 's/^"\{0,1\}\([^" ]*\)"\{0,1\} = .*/\1/p' config/mise/config.toml config/mise/conf.d/macos.toml); do "$RUNNER_TEMP/mise" latest "$t"; done
      - name: preflight without a tty keeps what it finds
        run: |
          export HOME="$RUNNER_TEMP/ci-home"; mkdir -p "$HOME/.emacs.d"
          printf '[user]\n\tname = CI\n\temail = ci@example.com\n' > "$HOME/.gitconfig"
          ./preflight.sh
          test -d "$HOME/.emacs.d" && test -f "$HOME/.gitconfig"
      - name: install into a fresh HOME twice (archive, prune), start the real shell
        run: |
          export HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$HOME/.config/ghostty" && echo old > "$HOME/.config/ghostty/config"
          ./install.sh | tee "$RUNNER_TEMP/install.log"
          grep -q "^archived   $HOME/.config/ghostty/config" "$RUNNER_TEMP/install.log"
          ./install.sh
          ./install.sh check
          out=$(zsh -i -c exit 2>&1 | grep -v "can.t change option: zle" || true)
          [ -z "$out" ] || { echo "$out"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci-home/.config/emacs/elpa
          key: elpa-${{ runner.os }}-${{ hashFiles('emacs/init.el') }}
      - name: load init.el (installs packages), then byte-compile
        run: |
          export HOME="$RUNNER_TEMP/ci-home"
          xdg='(setq user-emacs-directory (expand-file-name "~/.config/emacs/") package-user-dir (expand-file-name "~/.config/emacs/elpa"))'
          emacs --batch --eval "$xdg" -l emacs/early-init.el -l emacs/init.el --eval '(message "loaded %d packages" (length package-activated-list))'
          emacs --batch --eval "$xdg" -l emacs/early-init.el -l emacs/init.el -f batch-byte-compile emacs/early-init.el emacs/init.el
