name: ci
on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: apt-get update -q && apt-get install -y -q git ca-certificates
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: every package in os/apt-packages.txt exists on trixie
        run: xargs -a os/apt-packages.txt apt-get install -y -q
      - name: every uv tool and npm package resolves and lands in ~/.local/bin
        run: |
          export HOME=/tmp/ci-home PATH=/tmp/ci-home/.local/bin:$PATH npm_config_prefix=/tmp/ci-home/.local
          pipx install uv
          while read -r t; do uv tool install "$t"; done < os/uv-tools.txt
          xargs -a os/npm-packages.txt npm install -g
          for b in uv ruff basedpyright tsc typescript-language-server prettier; do command -v "$b"; done
      - run: shellcheck bootstrap.sh bin/dots os/*.sh os/macos/*.sh claude/statusline.sh kde/*.sh
      - run: zsh -n zsh/.zshenv zsh/.zprofile zsh/.zshrc zsh/home.zshenv
      - run: jq empty claude/settings.json && git config -f config/git/config -l >/dev/null
      - name: link into a fresh HOME twice (move aside, prune), start the real shell
        run: |
          export HOME=/tmp/ci-home
          mkdir -p "$HOME/.config/ghostty" && echo old > "$HOME/.config/ghostty/config"
          bin/dots link | tee /tmp/link.log
          grep -q "^moved      $HOME/.config/ghostty/config" /tmp/link.log
          bin/dots link
          bin/dots check
          test -x "$HOME/.local/bin/dots"
          out=$(timeout 30 zsh -i -c exit 2>&1 | grep -v "can.t change option: zle" || true)
          [ -z "$out" ] || { echo "$out"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: /tmp/ci-home/.config/emacs/elpa
          key: elpa-${{ runner.os }}-${{ hashFiles('emacs/init.el') }}
      - name: load init.el (installs packages), then byte-compile
        run: |
          export HOME=/tmp/ci-home
          xdg='(setq user-emacs-directory (expand-file-name "~/.config/emacs/") package-user-dir (expand-file-name "~/.config/emacs/elpa"))'
          emacs --batch --eval "$xdg" -l emacs/early-init.el -l emacs/init.el --eval '(message "loaded %d packages" (length package-activated-list))'
          emacs --batch --eval "$xdg" -l emacs/early-init.el -l emacs/init.el -f batch-byte-compile emacs/early-init.el emacs/init.el

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: every tap, formula and cask in os/Brewfile resolves (casks skipped)
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          HOMEBREW_BUNDLE_CASK_SKIP=$(brew bundle list --file os/Brewfile --cask | tr '\n' ' ') brew bundle --file os/Brewfile
      - run: brew install -q emacs
      - run: shellcheck bootstrap.sh bin/dots os/*.sh os/macos/*.sh claude/statusline.sh kde/*.sh
      - run: zsh -n zsh/.zshenv zsh/.zprofile zsh/.zshrc zsh/home.zshenv
      - run: plutil -lint os/macos/*.plist
      - name: link into a fresh HOME twice (move aside, prune), start the real shell
        run: |
          export HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$HOME/.config/ghostty" && echo old > "$HOME/.config/ghostty/config"
          bin/dots link | tee "$RUNNER_TEMP/link.log"
          grep -q "^moved      $HOME/.config/ghostty/config" "$RUNNER_TEMP/link.log"
          bin/dots link
          bin/dots check
          test -x "$HOME/.local/bin/dots"
          out=$(zsh -i -c exit 2>&1 | grep -v "can.t change option: zle" || true)
          [ -z "$out" ] || { echo "$out"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci-home/.config/emacs/elpa
          key: elpa-${{ runner.os }}-${{ hashFiles('emacs/init.el') }}
      - name: load init.el (installs packages), then byte-compile
        run: |
          export HOME="$RUNNER_TEMP/ci-home"
          xdg='(setq user-emacs-directory (expand-file-name "~/.config/emacs/") package-user-dir (expand-file-name "~/.config/emacs/elpa"))'
          emacs --batch --eval "$xdg" -l emacs/early-init.el -l emacs/init.el --eval '(message "loaded %d packages" (length package-activated-list))'
          emacs --batch --eval "$xdg" -l emacs/early-init.el -l emacs/init.el -f batch-byte-compile emacs/early-init.el emacs/init.el
