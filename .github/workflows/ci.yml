name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s bash -e SC1090,SC1091 setup.sh bash/bashrc bash/bash_profile
      - run: jq empty claude/settings.json vscode/settings.json
      - run: git config -f git/config -l >/dev/null

  links:
    # link() must be idempotent and must not clobber an existing .bak
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: link into a fresh HOME, twice
        run: |
          export HOME="$RUNNER_TEMP/ci-home"
          mkdir -p "$HOME"
          echo original > "$HOME/.bashrc"
          echo previous > "$HOME/.bashrc.bak"

          ./setup.sh --links-only
          test "$(readlink "$HOME/.bashrc")" = "$PWD/bash/bashrc"
          test "$(cat "$HOME/.bashrc.bak")" = previous          # existing .bak untouched
          test "$(cat "$HOME"/.bashrc.bak.*)" = original        # displaced file kept
          test "$(readlink "$HOME/.claude/settings.json")" = "$PWD/claude/settings.json"
          test "$(readlink "$HOME/.config/git/config")" = "$PWD/git/config"

          ./setup.sh --links-only                               # second run is a no-op
          test "$(readlink "$HOME/.bashrc")" = "$PWD/bash/bashrc"
          test "$(ls "$HOME"/.bashrc.bak.* | wc -l)" -eq 1

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: every formula and cask setup.sh installs resolves
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          for f in bash git gh jq node; do brew info --formula "$f" >/dev/null; done
          for c in visual-studio-code google-chrome tailscale-app claude-code; do brew info --cask "$c" >/dev/null; done
      - run: plutil -lint macos/*.plist
